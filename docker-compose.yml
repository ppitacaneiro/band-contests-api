services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: band-contests-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://band_contests:band_contests_dev@postgres:5432/band_contests?schema=public
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: band-contests-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: band_contests
      POSTGRES_USER: band_contests
      POSTGRES_PASSWORD: band_contests_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U band_contests -d band_contests"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: